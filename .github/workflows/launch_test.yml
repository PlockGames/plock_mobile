name: CI For Plock Mobile

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v2

      - name: Set up Flutter
        uses: subosito/flutter-action@v1
        with:
          channel: stable
          flutter-version: '3.24.0'

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Flutter Tests
        run: flutter test --coverage

      - name: Fix Slashes in Coverage File
        run: sed -i 's|\\|/|g' coverage/lcov-report/lcov.info

      - name: Generate Coverage HTML Report
        run: genhtml coverage/lcov-report/lcov.info -o coverage/html

      - name: Upload Coverage Report
        uses: actions/upload-artifact@v3
        with:
          name: coverage-report
          path: coverage/html
