name: Test For Plock Mobile

on:
  push:
    branches:
      - develop
      - main
      - feat/Plock-177
  pull_request:
    branches:
      - develop
      - main
      - feat/Plock-177

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v2

      - name: Set up Flutter
        uses: subosito/flutter-action@v1
        with:
          channel: stable
          flutter-version: '3.24.0'

      - name: Install Dependencies
        run: flutter pub get

      - name: Ensure .env exists
        run: |
          if [ ! -f .env ]; then
            echo ".env file missing, creating from .env.example"
            cp .env.example .env
          fi

      # Step 1: Run only the tests first to identify failures
      - name: Run Flutter Tests
        id: run_tests
        run: |
          mkdir -p test_results
          flutter test --reporter json > test_results/test_output.json || echo "Tests completed with failures"
        timeout-minutes: 5

      # Step 2: Generate coverage even if some tests fail
      - name: Generate Coverage
        run: |
          flutter test --coverage --no-test-assets || echo "Coverage generation completed with some failures"
        timeout-minutes: 5

      - name: Fix Slashes in Coverage File
        run: |
          if [ -f coverage/lcov.info ]; then
            sed -i 's|\\|/|g' coverage/lcov.info
          else
            echo "lcov.info file not found, skipping fix"
          fi

      - name: Install lcov
        run: sudo apt-get update && sudo apt-get install -y lcov

      - name: Remove Unwanted Files from Coverage
        run: |
          if [ -f coverage/lcov.info ]; then
            # Create a file with all exclusion patterns
            cat > exclude_patterns.txt << EOL
            lib/models/component_flame/component_flame_empty.dart
            lib/models/component_flame/component_flame_circle.dart
            lib/models/component_flame/component_flame_image.dart
            lib/models/component_flame/component_flame_rect.dart
            lib/models/component_flame/component_flame_sprite.dart
            lib/models/component_flame/component_flame_text.dart
            lib/models/component_flame/component_flame_tile.dart
            lib/models/component_flame/component_flame_tilemap.dart
            lib/models/component_types/component_physics_circle.dart
            lib/models/component_types/component_physics.dart
            lib/models/component_fields/tilemap/loaded_media_tile.dart
            lib/models/component_fields/tilemap/tilemap_editor.dart
            lib/models/component_fields/tilemap/tilemap_editor_page.dart
            lib/models/component_fields/tilemap/tilemap_editor_page_loaded.dart
            lib/models/component_fields/tilemap/tilemap_editor_painter.dart
            lib/models/component_fields/tilemap/tilemap_editor_top_bar.dart
            lib/models/component_fields/tilemap/tilemap_editor_page.dart
            lib/models/component_fields/tilemap/tilemap_editor_page_loaded.dart.dart
            lib/models/component_fields/tileset/tileset_editor_page_loaded.dart
            lib/models/component_fields/tileset/tileset_editor_painter.dart
            lib/services/api.dart
            lib/main.dart
            lib/theme.dart
            EOL
            
            # Process all exclusions in one command
            while read -r pattern; do
              lcov --remove coverage/lcov.info "$pattern" -o coverage/lcov.info || true
            done < exclude_patterns.txt
          else
            echo "lcov.info file not found, skipping exclusions"
          fi
        continue-on-error: true
        timeout-minutes: 2

      - name: Generate Coverage HTML Report
        run: |
          if [ -f coverage/lcov.info ]; then
            genhtml coverage/lcov.info -o coverage/html || echo "HTML generation completed with issues"
          else
            echo "lcov.info file not found, skipping HTML generation"
            mkdir -p coverage/html
            echo "Coverage report could not be generated due to test failures" > coverage/html/index.html
          fi
        continue-on-error: true
        timeout-minutes: 2

      # Parse test results to create a summary
      - name: Generate Test Summary
        run: |
          if [ -f test_results/test_output.json ]; then
            echo "## Test Results Summary" > test_results/summary.md
            echo "" >> test_results/summary.md
            
            # Count passing tests
            passing=$(grep -c '"success":true' test_results/test_output.json || echo "0")
            echo "✅ Passing tests: $passing" >> test_results/summary.md
            
            # Count failing tests and extract their names
            echo "" >> test_results/summary.md
            echo "### Failed Tests" >> test_results/summary.md
            grep -B 3 '"success":false' test_results/test_output.json | grep '"name"' | sed 's/.*"name": "\(.*\)",/- \1/' >> test_results/summary.md || echo "- No test failures found" >> test_results/summary.md
            
            cat test_results/summary.md
          else
            echo "Test output file not found"
          fi
        continue-on-error: true

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test_results
        timeout-minutes: 1

      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/html
        timeout-minutes: 1
        
      # This step makes the workflow succeed even if tests fail
      # Remove this step if you want the workflow to fail when tests fail
      - name: Set exit status
        run: exit 0
